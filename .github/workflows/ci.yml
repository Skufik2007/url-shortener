name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # последний патч 1.27.x; минимальная версия задана директивой toolchain go1.27.2 в go.mod
          go-version: "1.27.x"
          check-latest: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -coverprofile=coverage.out ./...

      - name: upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  integration:
    name: integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: shortener
          POSTGRES_PASSWORD: shortener
          POSTGRES_DB: shortener
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shortener -d shortener"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://shortener:shortener@localhost:5432/shortener?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # последний патч 1.27.x; минимальная версия задана директивой toolchain go1.27.2 в go.mod
          go-version: "1.27.x"
          check-latest: true

      - name: go test (integration)
        run: go test -tags integration ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # последний патч 1.27.x; минимальная версия задана директивой toolchain go1.27.2 в go.mod
          go-version: "1.27.x"
          check-latest: true

      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # последний патч 1.27.x; минимальная версия задана директивой toolchain go1.27.2 в go.mod
          go-version: "1.27.x"
          check-latest: true

      - name: gosec
        # gosec@latest зависит от x/tools, не читающего формат экспорта Go 1.27;
        # собираем его с последней x/tools во временном модуле.
        run: |
          mkdir -p "$RUNNER_TEMP/gosec" && cd "$RUNNER_TEMP/gosec"
          go mod init gosecbuild
          go get github.com/securego/gosec/v2/cmd/gosec@latest golang.org/x/tools@latest
          go build -o "$RUNNER_TEMP/gosec/gosec" github.com/securego/gosec/v2/cmd/gosec
          cd "$GITHUB_WORKSPACE" && "$RUNNER_TEMP/gosec/gosec" ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  docker:
    name: docker
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: url-shortener:ci
