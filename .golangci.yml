version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - gosec
    - bodyclose
    - misspell
    - revive
    - gocritic
  settings:
    revive:
      # Умеренный набор правил (без требования комментариев ко всем экспортируемым символам).
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: increment-decrement
        - name: indent-error-flow
        - name: receiver-naming
        - name: superfluous-else
        - name: unreachable-code
        # unused-parameter не включён: методы, реализующие интерфейсы (storage.Store,
        # http.HandlerFunc), обязаны принимать ctx / *http.Request, даже если не используют их.
        - name: var-naming
  exclusions:
    generated: lax
    rules:
      - path: '_test\.go$'
        linters:
          - gosec

issues:
  # показывать все замечания, а не первые три каждого вида
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
