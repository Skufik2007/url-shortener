version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - gosec
    - bodyclose
    - misspell
    - revive
    - gocritic
  settings:
    revive:
      # Умеренный набор правил (без требования комментариев ко всем экспортируемым символам).
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: increment-decrement
        - name: indent-error-flow
        - name: receiver-naming
        - name: superfluous-else
        - name: unreachable-code
        - name: unused-parameter
        - name: var-naming
  exclusions:
    generated: lax
    rules:
      - path: '_test\.go$'
        linters:
          - gosec

formatters:
  enable:
    - gofmt
